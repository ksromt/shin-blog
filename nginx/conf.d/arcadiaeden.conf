# arcadiaeden.com — legacy domain, redirects to main site (arcadiakokoro.com)
# HTTPS served directly with Let's Encrypt (no Cloudflare in front of this domain).
# Cert lives on the host at /etc/letsencrypt, mounted read-only into this container.
server {
    listen 80;
    server_name arcadiaeden.com www.arcadiaeden.com;

    # Let's Encrypt ACME challenge (webroot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://arcadiakokoro.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name arcadiaeden.com www.arcadiaeden.com;

    ssl_certificate     /etc/letsencrypt/live/arcadiaeden.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcadiaeden.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://arcadiakokoro.com$request_uri;
}
