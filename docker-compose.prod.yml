services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: shinblog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shin_blog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No external port — only accessible from internal network
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Next.js Blog
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shinblog-app
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/shin_blog
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RAG_API_URL: http://rag-api:8001
      KOCLAW_GATEWAY_URL: ${KOCLAW_GATEWAY_URL:-}
      NEXT_PUBLIC_KOCLAW_WS_URL: ${NEXT_PUBLIC_KOCLAW_WS_URL:-}
      NEXT_PUBLIC_KOCLAW_ASSETS_URL: ${NEXT_PUBLIC_KOCLAW_ASSETS_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # Kokoron RAG API
  rag-api:
    build:
      context: ../RAG
      dockerfile: Dockerfile.api
    container_name: shinblog-rag
    expose:
      - "8001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - rag_chroma:/app/chroma_db
      - rag_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # Nginx Reverse Proxy (HTTP only — Cloudflare handles SSL)
  nginx:
    image: nginx:alpine
    container_name: shinblog-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - blog
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  rag_chroma:
  rag_data:
